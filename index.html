<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruez Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" style="display:none;">

    <div class="menu">

        <div class="header">

            <h1>Admin Menu</h1>

            <button onclick="closeMenu()">X</button>

        </div>

        <input
            type="text"
            id="search"
            placeholder="Search Player..."
            onkeyup="searchPlayer()"
        >

        <div id="playerList"></div>

    </div>

</div>

<div id="warningOverlay" style="display:none;">

    <div class="warning-box">

        <h1>WARNING</h1>

        <p id="warningReason">No reason provided</p>

        <div class="hold-box">

            <div id="holdProgress"></div>

        </div>

        <span>Hold E for 10 seconds</span>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
